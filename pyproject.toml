[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quadproxy"
version = "1.0.0"
description = "Production-grade authenticated HTTP proxy starter kit for PyQt5 and PyQt6 QWebEngineView."
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "QuadProxy Development Team", email = "support@quadproxy.com" }
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
pyqt6 = ["PyQt6>=6.0.0", "PyQt6-WebEngine>=6.0.0"]
pyqt5 = ["PyQt5>=5.15.0", "PyQtWebEngine>=5.15.0"]

[project.scripts]
quadproxy-doctor = "quadproxy.cli:main"
quadproxy-wizard = "quadproxy.wizard:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["quadproxy*"]
